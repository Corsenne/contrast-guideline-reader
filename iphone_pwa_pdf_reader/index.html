<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="造影剤GL" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>造影剤使用に関する院内ガイドライン</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="title-block">
        <h1>造影剤使用に関する院内ガイドライン</h1>
        <p id="pageStatus">読み込み中...</p>
      </div>
      <div class="actions">
        <button id="tocButton" type="button" aria-label="目次">目次</button>
        <button id="addMarkerButton" type="button" aria-label="マーカー追加">追加</button>
        <button id="markersButton" type="button" aria-label="マーカー一覧">一覧</button>
      </div>
    </header>

    <main class="reader-shell">
      <section id="pdfStage" class="pdf-stage" aria-label="PDF表示エリア">
        <div id="loading" class="loading">PDFを読み込んでいます</div>
        <canvas id="pdfCanvas"></canvas>
      </section>
    </main>

    <footer class="bottombar">
      <button id="prevButton" type="button">前へ</button>
      <input id="pageSlider" type="range" min="1" max="11" value="1" aria-label="ページ移動" />
      <button id="nextButton" type="button">次へ</button>
    </footer>

    <dialog id="tocDialog" class="sheet">
      <form method="dialog">
        <div class="sheet-header">
          <h2>目次</h2>
          <button value="cancel" aria-label="閉じる">閉じる</button>
        </div>
      </form>
      <div id="tocList" class="list"></div>
    </dialog>

    <dialog id="markerDialog" class="sheet">
      <form method="dialog">
        <div class="sheet-header">
          <h2>マーカー一覧</h2>
          <button value="cancel" aria-label="閉じる">閉じる</button>
        </div>
      </form>
      <div id="markerList" class="list"></div>
    </dialog>

    <dialog id="addMarkerDialog" class="sheet">
      <form id="addMarkerForm">
        <div class="sheet-header">
          <h2>マーカー追加</h2>
          <button value="cancel" formmethod="dialog" aria-label="閉じる">閉じる</button>
        </div>
        <label>
          選択テキスト、または見出しメモ
          <textarea id="selectedTextInput" rows="3" autocomplete="off"></textarea>
        </label>
        <label>
          メモ
          <textarea id="noteInput" rows="4" autocomplete="off"></textarea>
        </label>
        <label>
          色
          <select id="colorInput">
            <option value="yellow">yellow</option>
            <option value="green">green</option>
            <option value="pink">pink</option>
            <option value="blue">blue</option>
          </select>
        </label>
        <button class="primary" type="submit">保存</button>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="app.js" type="module"></script>
  </body>
</html>
